[project]
name = "how"
version = "0.1.0"
description = "Asking How questions with LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.3.4",
    "litellm>=1.67.5",
    "loguru>=0.7.3",
    "matplotlib>=3.9.4",
    "pandas>=2.2.3",
    "plancraft[full]==0.4.9",
    "pytest>=8.3.4",
    "rich>=13.9.4",
    "smolagents>=1.14.0",
    "wandb>=0.19.4",
    "vllm>=0.9.1; sys_platform != 'darwin'",
    "flash-attn>=2.8; sys_platform != 'darwin'",
    "flashinfer-python>=0.2.3; sys_platform != 'darwin'",
    "typer>=0.15.3",
    "pillow>=11.2.1",
    "statsmodels>=0.14.5",
]

[tool.uv]
no-build-isolation-package = ['flash-attn']